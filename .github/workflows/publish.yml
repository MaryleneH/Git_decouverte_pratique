name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Les mini-films (assets/video/*.mp4) sont versionnés via Git LFS :
          # sans lfs: true, le site publié servirait les pointeurs texte de
          # 134 octets au lieu des vraies vidéos.
          lfs: true

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      # Active GitHub Pages (source « GitHub Actions ») si ce n'est pas
      # déjà fait — sans cette étape, le job deploy échoue tant que Pages
      # n'a pas été activé manuellement dans Settings → Pages.
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Rendre le site
        run: quarto render

      - name: Téléverser l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
